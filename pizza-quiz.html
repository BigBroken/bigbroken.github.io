<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pizza Quiz</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f8f8f8; }
h1 { color: #333; text-align: center; }
form { background-color: #fff; padding: 20px; border-radius: 5px; max-width: 600px; margin: 0 auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
label { display: block; margin-top: 15px; }
input[type="text"], select { width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc; }
.question { margin-top: 10px; }
.submit-btn { margin-top: 20px; padding: 10px 20px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
.submit-btn:hover { background-color: #0056b3; }
</style>
<script>

</script>
</head>
<body>
<h1>Pizza Quiz</h1>
<<form onsubmit="handleQuizSubmit(even)">
  <label for="name">What is your name?</label>
  <input type="text" id="name" name="name" required>

  <div class="question">
    <label for="topping">What is your favorite pizza topping?</label>
    <select name="topping" id="topping" required>
      <option value="">Select a topping</option>
      <option value="pepperoni">Pepperoni</option>
      <option value="mushrooms">Mushrooms</option>
      <option value="cheese">Extra Cheese</option>
      <option value="vegetables">Vegetables</option>
      <option value="other">Other</option>
    </select>
  </div>
  
<div class="question">
  <label>What is a close second most popular pizza topping in Canada?</label>
  <label><input type="radio" name="canada_topping" value="mushrooms"> Mushrooms</label>
  <label><input type="radio" name="canada_topping" value="bacon"> Bacon</label>
  <label><input type="radio" name="canada_topping" value="onions"> Onions</label>
  <label><input type="radio" name="canada_topping" value="anchovies"> Anchovies</label>
</div>

<div class="question">
  <label>Which cheese is traditionally used on an authentic Neapolitan pizza?</label>
  <label><input type="radio" name="neapolitan_cheese" value="cheddar"> Cheddar</label>
  <label><input type="radio" name="neapolitan_cheese" value="provolone"> Provolone</label>
  <label><input type="radio" name="neapolitan_cheese" value="mozzarella_di_bufala"> Mozzarella di Bufala</label>
  <label><input type="radio" name="neapolitan_cheese" value="gouda"> Gouda</label>
</div>

<div class="question">
  <label>A classic Neapolitan pizza is traditionally topped with pepperoni.</label>
  <label><input type="radio" name="classic_pepperoni" value="true"> True</label>
  <label><input type="radio" name="classic_pepperoni" value="false"> False</label>
</div>

<div class="question">
  <label>Which of these cities has the highest number of pizzerias per capita?</label>
  <label><input type="radio" name="city_pizzerias" value="corpus_christi"> Corpus Christi, Texas</label>
  <label><input type="radio" name="city_pizzerias" value="austin"> Austin, Texas</label>
  <label><input type="radio" name="city_pizzerias" value="buffalo"> Buffalo, New York</label>
  <label><input type="radio" name="city_pizzerias" value="fort_erie"> Fort Erie, Canada</label>
</div>

<div class="question">
  <label>Which sauce replaces the traditional tomato base on a typical Texas‑style brisket pizza?</label>
  <label><input type="radio" name="texas_sauce" value="alfredo"> Alfredo sauce</label>
  <label><input type="radio" name="texas_sauce" value="bbq"> BBQ sauce</label>
  <label><input type="radio" name="texas_sauce" value="ranch"> Ranch dressing</label>
  <label><input type="radio" name="texas_sauce" value="pesto"> Pesto</label>
</div>

<div class="question">
  <label>What is the name of the traditional Alsatian “pizza” topped with crème fraîche, onions, and lardons?</label>
  <label><input type="radio" name="alsatian" value="quiche_lorraine"> Quiche Lorraine</label>
  <label><input type="radio" name="alsatian" value="flammekueche"> Flammekueche (tarte flambée)</label>
  <label><input type="radio" name="alsatian" value="pissaladiere"> Pissaladière</label>
  <label><input type="radio" name="alsatian" value="pain_a_la_grecque"> Pain à la grecque</label>
</div>

<div class="question">
  <label>According to behavioral economist Dan Ariely’s research, which pair of incentives outperformed cash bonuses in boosting employee productivity?</label>
  <label><input type="radio" name="productivity_incentives" value="vacation_giftcards"> Extra vacation days &amp; gift cards</label>
  <label><input type="radio" name="productivity_incentives" value="pizza_compliments"> Pizza &amp; verbal compliments</label>
  <label><input type="radio" name="productivity_incentives" value="swag_coffee"> Company swag &amp; free coffee</label>
  <label><input type="radio" name="productivity_incentives" value="stock_options_flex_hours"> Stock options &amp; flexible hours</label>
</div>

<div class="question">
  <label>Which of the following gives the total number of possible combinations of <em>N</em> distinct pizza toppings (including the plain crust)?</label>
  <label><input type="radio" name="combinations_formula" value="factorial"> <em>N</em>!</label>
  <label><input type="radio" name="combinations_formula" value="double_n"> 2×<em>N</em></label>
  <label><input type="radio" name="combinations_formula" value="power_of_two"> 2^<em>N</em></label>
  <label><input type="radio" name="combinations_formula" value="square"> <em>N</em>^2</label>
</div>

<div class="question">
  <label>Who said this quote?<br>“You always have the pleasure in doing your thing well; it must give you independence from the whole buffoonery into which we have been born.”</label>
  <label><input type="radio" name="quote_author" value="einstein"> Albert Einstein</label>
  <label><input type="radio" name="quote_author" value="montgomery"> Albert Montgomery (Business bro)</label>
  <label><input type="radio" name="quote_author" value="forkish"> Ken Forkish (author of The Elements of Pizza)</label>
  <label><input type="radio" name="quote_author" value="vera_wesley_charlotte"> Vera, Wesley, Charlotte (authors of We Want Macaroni Now)</label>
</div>


  <div class="question">
    <label>Which crust do you prefer?</label>
    <label><input type="radio" name="crust" value="thin" required> Thin Crust</label>
    <label><input type="radio" name="crust" value="thick" required> Thick Crust</label>
  </div>

  <div class="question">
    <label>How often do you eat pizza?</label>
    <label><input type="radio" name="frequency" value="weekly" required> Weekly</label>
    <label><input type="radio" name="frequency" value="monthly" required> Monthly</label>
  <label><input type="radio" name="frequency" value="rarely" required> Rarely</label>
    <label><input type="radio" name="frequency" value="never" required> Never</label>
  </div>

  <button type="submit" class="submit-btn">Submit Quiz</button>
</
   
  </form><script>
    function handleQuizSubmit(event) {
      event.preventDefault();
      const form = event.target;
      let correct = 0;
      const answers = {
        canada_topping: "anchovies",
        neapolitan_cheese: "mozzarella_di_bufala",
        classic_pepperoni: "false",
        city_pizzerias: "buffalo",
        texas_sauce: "bbq",
        alsatian: "Flammekueche",
        productivity_incentives: "pizza_compliments",
        combinations_formula: "power_of_two",
        quote_author: "einstein"
      };
      for (const key in answers) {
        const selected = form.querySelector('input[name="' + key + '"]:checked');
        if (selected && selected.value === answers[key]) {
          correct++;
        }
      }
  alert('Your pizza quiz responses has been deleted. You have earned ' + correct + ' pizza(s)');
   
form.reset();
}
    }
    </</script>>
</body>
</html>
